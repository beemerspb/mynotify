<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">Как работает MyNotify</title>
  <desc id="d">Камеры отдают RTSP в go2rtc; Home Assistant с интеграцией MyNotify шлёт Android-устройству команды по HTTP, а окно на устройстве забирает HLS-видео из go2rtc.</desc>
  <rect width="1200" height="460" rx="26" fill="#0B0B0F"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98989F"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0A84FF"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#30D158"/>
    </marker>
  </defs>
  <text x="64" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#F5F5F7">Как это работает</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Камеры -->
    <g transform="translate(64 120)">
      <rect width="240" height="120" rx="18" fill="#1C1C1E" stroke="#38383A" stroke-width="1.5"/>
      <circle cx="44" cy="44" r="16" fill="none" stroke="#BF5AF2" stroke-width="3"/>
      <circle cx="44" cy="44" r="6" fill="#BF5AF2"/>
      <text x="76" y="52" font-size="22" font-weight="600" fill="#F5F5F7">Камеры</text>
      <text x="24" y="98" font-size="18" fill="#98989F">RTSP-потоки</text>
    </g>
    <!-- go2rtc -->
    <g transform="translate(424 120)">
      <rect width="240" height="120" rx="18" fill="#1C1C1E" stroke="#38383A" stroke-width="1.5"/>
      <rect x="28" y="30" width="32" height="26" rx="6" fill="none" stroke="#FF9F0A" stroke-width="3"/>
      <path d="M44 56 v12 M34 68 h20" stroke="#FF9F0A" stroke-width="3"/>
      <text x="76" y="52" font-size="22" font-weight="600" fill="#F5F5F7">go2rtc</text>
      <text x="24" y="98" font-size="18" fill="#98989F">конвертер видео</text>
    </g>
    <!-- Home Assistant -->
    <g transform="translate(784 120)">
      <rect width="300" height="120" rx="18" fill="#1C1C1E" stroke="#0A84FF" stroke-width="2"/>
      <path d="M44 46 l18 -18 18 18 v16 h-36 z" fill="none" stroke="#0A84FF" stroke-width="3"/>
      <text x="88" y="52" font-size="21" font-weight="600" fill="#F5F5F7">Home Assistant</text>
      <text x="24" y="98" font-size="17" fill="#98989F">интеграция MyNotify</text>
    </g>
    <!-- Устройство -->
    <g transform="translate(620 300)">
      <rect width="464" height="110" rx="18" fill="#1C1C1E" stroke="#30D158" stroke-width="2"/>
      <rect x="26" y="28" width="40" height="54" rx="8" fill="none" stroke="#30D158" stroke-width="3"/>
      <text x="84" y="56" font-size="22" font-weight="600" fill="#F5F5F7">Планшет / Android TV</text>
      <text x="84" y="84" font-size="18" fill="#98989F">окно с камерой поверх экрана</text>
    </g>

    <!-- стрелки потока видео -->
    <path d="M304 180 H416" stroke="#98989F" stroke-width="2.5" marker-end="url(#arr)"/>
    <path d="M664 180 H776" stroke="#98989F" stroke-width="2.5" marker-end="url(#arr)"/>
    <!-- команды HA -> устройство -->
    <path d="M1050 240 V275 H585 V330 H616" stroke="#0A84FF" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#arrb)"/>
    <text x="600" y="262" font-size="17" fill="#0A84FF">команды HTTP: показать / скрыть / камера</text>
    <!-- видео go2rtc -> устройство -->
    <path d="M519 240 V355 H616" stroke="#30D158" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/>
    <text x="505" y="300" font-size="17" text-anchor="end" fill="#30D158">HLS-видео</text>
    <!-- подпись слева -->
    <text x="64" y="380" font-size="18" fill="#98989F">Устройство само опрашивает Home Assistant —</text>
    <text x="64" y="406" font-size="18" fill="#98989F">никаких открытых портов наружу не нужно.</text>
  </g>
</svg>
