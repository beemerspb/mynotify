<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Сущности MyNotify в Home Assistant</title>
  <desc id="d">Карточка устройства: выключатель окна, выпадающий список камер go2rtc, кнопки скриншота, полноэкранного режима и записи; отдельной плиткой — сервисы для автоматизаций.</desc>
  <rect width="1200" height="360" rx="26" fill="#0B0B0F"/>
  <text x="64" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="700" fill="#F5F5F7">Всё в одной карточке устройства</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(64 104)">
      <rect width="660" height="224" rx="20" fill="#1C1C1E" stroke="#38383A" stroke-width="1.5"/>
      <text x="28" y="46" font-size="22" font-weight="600" fill="#F5F5F7">Планшет Android</text>
      <line x1="0" y1="64" x2="660" y2="64" stroke="#38383A" stroke-width="1.5"/>
      <text x="28" y="106" font-size="21" fill="#F5F5F7">Окно камеры</text>
      <rect x="556" y="84" width="72" height="38" rx="19" fill="#0A84FF"/>
      <circle cx="609" cy="103" r="15" fill="#FFFFFF"/>
      <text x="28" y="156" font-size="21" fill="#F5F5F7">Камера</text>
      <rect x="480" y="132" width="148" height="38" rx="12" fill="#2C2C2E"/>
      <text x="554" y="157" text-anchor="middle" font-size="19" fill="#98989F">Cam4 ⌄</text>
      <text x="28" y="204" font-size="21" fill="#F5F5F7">В окне по тапу</text>
      <g transform="translate(260 180)">
        <rect x="0" y="0" width="146" height="34" rx="17" fill="#2C2C2E"/>
        <text x="73" y="23" text-anchor="middle" font-size="17" fill="#0A84FF">Во весь экран</text>
        <rect x="158" y="0" width="100" height="34" rx="17" fill="#2C2C2E"/>
        <text x="208" y="23" text-anchor="middle" font-size="17" fill="#FF453A">Закрыть</text>
      </g>
    </g>
    <g transform="translate(760 104)">
      <rect width="376" height="224" rx="20" fill="#161618" stroke="#0A84FF" stroke-width="1.5"/>
      <text x="28" y="46" font-size="22" font-weight="600" fill="#F5F5F7">Для автоматизаций</text>
      <rect x="28" y="70" width="328" height="44" rx="10" fill="#1C1C1E"/>
      <text x="44" y="99" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#30D158">mynotify.show</text>
      <text x="204" y="99" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#98989F">показать камеру</text>
      <rect x="28" y="126" width="328" height="44" rx="10" fill="#1C1C1E"/>
      <text x="44" y="155" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#30D158">mynotify.hide</text>
      <text x="204" y="155" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#98989F">скрыть окно</text>
      <text x="28" y="204" font-size="17" fill="#98989F">target — тот же выключатель окна</text>
    </g>
  </g>
</svg>
