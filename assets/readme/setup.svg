<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
  <title id="t">Установка MyNotify за три шага</title>
  <desc id="d">Шаг 1 — установить APK и запустить службу. Шаг 2 — добавить интеграцию и ввести код привязки. Шаг 3 — пользоваться карточкой устройства в Home Assistant.</desc>
  <rect width="1200" height="500" rx="26" fill="#0B0B0F"/>
  <text x="48" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="700" fill="#F5F5F7">Установка за три шага</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(48 112)">
      <rect width="352" height="340" rx="20" fill="#1C1C1E" stroke="#38383A" stroke-width="1.5"/>
      <circle cx="60" cy="66" r="26" fill="#0A84FF"/>
      <text x="60" y="76" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text>
      <text x="104" y="76" font-size="25" font-weight="600" fill="#F5F5F7">Приложение</text>
      <text x="30" y="136" font-size="18" fill="#98989F">Установи APK из релиза</text>
      <text x="30" y="164" font-size="18" fill="#98989F">на телефон, планшет</text>
      <text x="30" y="192" font-size="18" fill="#98989F">или Android TV.</text>
      <text x="30" y="240" font-size="18" fill="#98989F">Выдай разрешение</text>
      <text x="30" y="268" font-size="18" fill="#98989F">«Поверх приложений»,</text>
      <text x="30" y="296" font-size="18" fill="#30D158">нажми «Запустить службу».</text>
    </g>
    <g transform="translate(428 112)">
      <rect width="352" height="340" rx="20" fill="#1C1C1E" stroke="#38383A" stroke-width="1.5"/>
      <circle cx="60" cy="66" r="26" fill="#0A84FF"/>
      <text x="60" y="76" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">2</text>
      <text x="104" y="76" font-size="25" font-weight="600" fill="#F5F5F7">Привязка</text>
      <text x="30" y="136" font-size="18" fill="#98989F">В Home Assistant добавь</text>
      <text x="30" y="164" font-size="18" fill="#98989F">интеграцию MyNotify,</text>
      <text x="30" y="192" font-size="18" fill="#98989F">укажи адрес go2rtc.</text>
      <rect x="30" y="224" width="292" height="62" rx="14" fill="#2C2C2E"/>
      <text x="176" y="264" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="28" font-weight="700" fill="#0A84FF" letter-spacing="3">482 913</text>
      <text x="30" y="316" font-size="17" fill="#98989F">код из приложения</text>
    </g>
    <g transform="translate(808 112)">
      <rect width="352" height="340" rx="20" fill="#1C1C1E" stroke="#30D158" stroke-width="2"/>
      <circle cx="60" cy="66" r="26" fill="#30D158"/>
      <text x="60" y="76" text-anchor="middle" font-size="28" font-weight="700" fill="#0B0B0F">3</text>
      <text x="104" y="76" font-size="25" font-weight="600" fill="#F5F5F7">Готово</text>
      <text x="30" y="136" font-size="18" fill="#98989F">Открой карточку устройства:</text>
      <text x="30" y="184" font-size="20" fill="#F5F5F7">Окно камеры</text>
      <rect x="270" y="162" width="52" height="30" rx="15" fill="#0A84FF"/>
      <circle cx="307" cy="177" r="12" fill="#FFFFFF"/>
      <text x="30" y="230" font-size="20" fill="#F5F5F7">Камера</text>
      <rect x="218" y="208" width="104" height="32" rx="10" fill="#2C2C2E"/>
      <text x="270" y="229" text-anchor="middle" font-size="18" fill="#98989F">Cam4 ⌄</text>
      <text x="30" y="282" font-size="18" fill="#98989F">Плюс сервисы show и hide</text>
      <text x="30" y="310" font-size="18" fill="#98989F">для автоматизаций.</text>
    </g>
  </g>
</svg>
