<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="MyNotify — живая камера поверх любого экрана, управление из Home Assistant">
  <title>MyNotify — живая камера поверх любого экрана, управление из Home Assistant</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e3a"/>
      <stop offset="1" stop-color="#123a6b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#0e2338"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <!-- телевизор/планшет как фон сцены -->
  <rect x="70" y="86" width="470" height="268" rx="14" fill="#08111f" stroke="#2e5c9e" stroke-width="2"/>
  <rect x="86" y="102" width="438" height="214" rx="8" fill="url(#screen)"/>
  <text x="104" y="132" font-family="monospace" font-size="15" fill="#4d77ab">▶ YouTube / фильм / рабочий стол</text>
  <rect x="104" y="150" width="300" height="10" rx="5" fill="#1d3a5c"/>
  <rect x="104" y="170" width="240" height="10" rx="5" fill="#1d3a5c"/>
  <rect x="104" y="190" width="340" height="10" rx="5" fill="#1d3a5c"/>
  <!-- плавающее окно камеры -->
  <g>
    <rect x="330" y="196" width="270" height="168" rx="12" fill="#0a1826" stroke="#4da3ff" stroke-width="3"/>
    <rect x="330" y="196" width="270" height="34" rx="12" fill="#173a61"/>
    <circle cx="352" cy="213" r="6" fill="#ff5f57"/>
    <text x="368" y="218" font-family="monospace" font-size="14" fill="#bfe0ff">камера · live</text>
    <rect x="346" y="244" width="238" height="104" rx="6" fill="#12283f"/>
    <path d="M352 336 L414 288 L462 322 L510 268 L578 314 L578 344 L352 344 Z" fill="#1f4f7d"/>
    <circle cx="540" cy="282" r="14" fill="#f2c14e"/>
    <rect x="346" y="244" width="238" height="104" rx="6" fill="none" stroke="#2e5c9e"/>
  </g>
  <!-- стрелка потока go2rtc -> окно -->
  <path d="M640 292 C 680 292 690 250 726 240" fill="none" stroke="#4da3ff" stroke-width="3" stroke-dasharray="8 7"/>
  <polygon points="726,240 712,236 718,250" fill="#4da3ff"/>
  <text x="646" y="330" font-family="monospace" font-size="15" fill="#7fb3ef">go2rtc · HLS</text>
  <!-- текст -->
  <text x="770" y="150" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#eaf4ff">MyNotify</text>
  <text x="772" y="196" font-family="Arial, sans-serif" font-size="24" fill="#9cc6f5">Живая камера поверх любого экрана Android</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#cfe6ff">
    <circle cx="782" cy="242" r="4" fill="#4da3ff"/><text x="798" y="248">Управление из Home Assistant: сущности и автоматизации</text>
    <circle cx="782" cy="282" r="4" fill="#4da3ff"/><text x="798" y="288">Без ADB: устройство само подключается к HA по коду</text>
    <circle cx="782" cy="322" r="4" fill="#4da3ff"/><text x="798" y="328">Список камер подтягивается из go2rtc автоматически</text>
  </g>
</svg>
