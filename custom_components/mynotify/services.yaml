show:
  name: "Показать камеру"
  description: >-
    Показывает оверлей-окно MyNotify с видеопотоком на привязанном
    Android-устройстве. stream — имя потока go2rtc (например Cam1) или
    полный http(s)-URL HLS-потока.
  fields:
    target:
      name: "Устройства"
      description: "Сущности MyNotify (устройства с приложением)."
      required: true
      selector:
        entity:
          integration: mynotify
          domain: switch
          multiple: true
    stream:
      name: "Камера"
      description: "Имя потока go2rtc (см. список «Камера» устройства) или полный URL. Показанная камера становится выбранной."
      required: true
      selector:
        text:
    autohide:
      name: "Автоскрытие, сек"
      description: "0 — не скрывать автоматически."
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3600
    mute:
      name: "Без звука"
      description: >-
        true — показать без звука, false — со звуком. Если не задан,
        используется настройка «Заглушать звук» на устройстве.
        Заданный параметр синхронизируется с этой настройкой.
      required: false
      selector:
        boolean:

hide:
  name: "Скрыть камеру"
  description: >-
    Закрывает оверлей-окно MyNotify (служба на устройстве продолжает
    работать в фоне).
  fields:
    target:
      name: "Устройства"
      description: "Сущности MyNotify."
      required: true
      selector:
        entity:
          integration: mynotify
          domain: switch
          multiple: true
